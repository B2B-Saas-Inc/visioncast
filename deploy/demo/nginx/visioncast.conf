# VisionCast demo edge, part 1 (http context): rate-limit zones, port 80 and the
# owner-only loopback listener. Installed to /etc/nginx/conf.d/visioncast.conf.
# The HTTPS server is in visioncast-tls.conf, installed only once the certificate exists.
#
# Clients: the Vercel site (server-side calls to /api/v1/*) and the owner through an
# SSH tunnel to 127.0.0.1:8081. Nothing sits in front of nginx, so $remote_addr is the
# real peer. Vercel functions share egress addresses; limits below are per address.

map $request_method $vc_post_client {
    POST    $binary_remote_addr;
    default "";
}
map $request_method $vc_get_client {
    GET     $binary_remote_addr;
    default "";
}

limit_req_zone $vc_post_client     zone=vc_register:10m rate=20r/m;   # registrations, reset
limit_req_zone $vc_get_client      zone=vc_profile:10m  rate=60r/m;   # profile, my-registration
limit_req_zone $binary_remote_addr zone=vc_api:10m      rate=300r/m;  # catalogue, forms, ICS, covers
limit_req_zone $vc_post_client     zone=vc_login:1m     rate=5r/m;    # owner login forms
limit_conn_zone $binary_remote_addr zone=vc_conn:10m;

# No query strings, cookies, referrer or user agent.
log_format vc_min '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

upstream visioncast_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Unknown Host on port 80 (including the bare IP): close the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

# Demo host on port 80: ACME HTTP-01 challenges (certbot --webroot), else HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 64-225-16-137.sslip.io;
    server_tokens off;
    access_log /var/log/nginx/visioncast.access.log vc_min;
    client_max_body_size 1k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/visioncast-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Owner-only: studio, admin and everything else, reachable only through an SSH tunnel
#   ssh -N -L 8081:127.0.0.1:8081 root@64.225.16.137   then   http://localhost:8081/studio/
# Django treats these requests as HTTPS (X-Forwarded-Proto) and trusts the exact origin
# http://localhost:8081 for CSRF, so the local port must be 8081.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    server_tokens off;
    access_log /var/log/nginx/visioncast-owner.access.log vc_min;
    client_max_body_size 3m;   # studio cover upload limit is 2 MB
    limit_req_status 429;

    include /etc/nginx/snippets/visioncast-proxy.conf;

    location = /studio/login/ {
        limit_req zone=vc_login burst=5 nodelay;
        proxy_pass http://visioncast_app;
    }
    location = /admin/login/ {
        limit_req zone=vc_login burst=5 nodelay;
        proxy_pass http://visioncast_app;
    }
    location / {
        proxy_pass http://visioncast_app;
    }
}
