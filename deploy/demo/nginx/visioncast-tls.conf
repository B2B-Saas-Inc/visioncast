# VisionCast demo edge, part 2: public HTTPS. Installed to
# /etc/nginx/conf.d/visioncast-tls.conf by deploy/demo/deploy.sh only after certbot has
# issued /etc/letsencrypt/live/64-225-16-137.sslip.io/.
#
# Allowlist: public API, static files, uploaded covers and the health check. Everything
# else is 404, including /studio/, /admin/, /mcp, /api/v1/manage/*, /w/ (waiting room),
# /developers/ and /webinar-api/* (the Vercel site serves its own /webinar-api/).
# nginx matches on the normalised, percent-decoded path.

# Unknown SNI (or none): refuse the handshake instead of presenting the demo certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 64-225-16-137.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/64-225-16-137.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64-225-16-137.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:vc_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/visioncast.access.log vc_min;

    # The Vercel proxy caps registration bodies at 32 KB.
    client_max_body_size  64k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn vc_conn 20;

    # HSTS, nosniff, referrer policy and secure cookies are set by Django.
    include /etc/nginx/snippets/visioncast-proxy.conf;

    location = /healthz {
        access_log off;
        limit_req zone=vc_api burst=20 nodelay;
        proxy_pass http://visioncast_app;
    }

    location ^~ /static/ {
        limit_except GET { deny all; }
        limit_req zone=vc_api burst=100 nodelay;
        proxy_pass http://visioncast_app;
    }
    location ^~ /media/covers/ {
        limit_except GET { deny all; }
        limit_req zone=vc_api burst=50 nodelay;
        proxy_pass http://visioncast_app;
    }

    # Management API: owner tunnel only.
    location ^~ /api/v1/manage {
        return 404;
    }

    # Visitor actions forwarded by the Vercel proxy (proxy-scoped key).
    location = /api/v1/registrations {
        limit_req zone=vc_register burst=10 nodelay;
        proxy_pass http://visioncast_app;
    }
    location = /api/v1/reset {
        limit_req zone=vc_register burst=10 nodelay;
        proxy_pass http://visioncast_app;
    }
    location = /api/v1/profile {
        limit_req zone=vc_profile burst=20 nodelay;
        proxy_pass http://visioncast_app;
    }
    location = /api/v1/my-registration {
        limit_req zone=vc_profile burst=20 nodelay;
        proxy_pass http://visioncast_app;
    }

    # Catalogue, form schemas, ICS, OpenAPI.
    location ^~ /api/v1/ {
        limit_req zone=vc_api burst=100 nodelay;
        proxy_pass http://visioncast_app;
    }

    location / {
        return 404;
    }
}
