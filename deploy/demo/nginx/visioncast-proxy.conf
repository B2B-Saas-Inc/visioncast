# Forwarding headers for the VisionCast demo (included at server level).
# Installed to /etc/nginx/snippets/visioncast-proxy.conf. Locations inherit these
# because none of them sets its own proxy_set_header.
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto https;          # overwrite, never pass the client's value
proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, do not append (one trusted hop)
proxy_set_header X-Forwarded-Host  "";
proxy_set_header X-Forwarded-Port  "";
proxy_connect_timeout 5s;
proxy_send_timeout    35s;
proxy_read_timeout    35s;                         # gunicorn timeout is 30s
