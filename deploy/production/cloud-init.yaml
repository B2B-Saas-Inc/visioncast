#cloud-config
# VisionCast production droplet (Ubuntu 24.04, DigitalOcean). Passed as user-data by
# deploy/production/provision.sh. Runs once at first boot, as root. No secrets here.
#
# What it sets up:
#   * user `deploy` (sudo without password, no login password) with the SSH key that
#     DigitalOcean injects into root's authorized_keys; password SSH logins disabled
#   * unattended-upgrades (security updates, automatic reboot 04:30 UTC if required)
#   * ufw: deny incoming except 22, 80, 443 (Docker publishes the web port on 127.0.0.1
#     only, so Docker's own iptables rules do not expose anything)
#   * fail2ban for sshd
#   * 2 GB swap file
#   * Docker Engine + Compose plugin from Docker's apt repository (key pinned by id),
#     json-file log rotation
#   * nginx, certbot (+ python3-certbot-nginx), age, curl, systemd-timesyncd
# Then deploy/production/bootstrap.sh does the application install.

hostname: visioncast-events
manage_etc_hosts: true
timezone: Etc/UTC
locale: C.UTF-8

users:
  - name: deploy
    gecos: VisionCast deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true

package_update: true
package_upgrade: true
package_reboot_if_required: false

apt:
  sources:
    docker:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      keyserver: https://download.docker.com/linux/ubuntu/gpg

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - nginx
  - certbot
  - python3-certbot-nginx
  - age
  - systemd-timesyncd
  - python3

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    permissions: "0644"
    content: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  - path: /etc/ssh/sshd_config.d/60-visioncast.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" },
        "live-restore": true
      }
  - path: /etc/sysctl.d/60-visioncast.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10
      net.ipv4.tcp_syncookies = 1

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

runcmd:
  # The SSH key DigitalOcean placed for root also authorises the deploy user.
  - [ sh, -c, "install -d -m 700 -o deploy -g deploy /home/deploy/.ssh && install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys" ]
  - [ systemctl, restart, ssh ]
  - [ ufw, default, deny, incoming ]
  - [ ufw, default, allow, outgoing ]
  - [ ufw, allow, "22/tcp" ]
  - [ ufw, allow, "80/tcp" ]
  - [ ufw, allow, "443/tcp" ]
  - [ ufw, --force, enable ]
  - [ systemctl, enable, --now, fail2ban ]
  - [ systemctl, enable, --now, systemd-timesyncd ]
  - [ systemctl, enable, --now, docker ]
  - [ systemctl, enable, --now, nginx ]
  - [ sysctl, --system ]
  - [ sh, -c, "install -d -m 755 /srv/visioncast /var/www/visioncast-acme && install -d -m 700 /root/visioncast-secrets /var/log/visioncast" ]
  - [ sh, -c, "docker --version && docker compose version && nginx -v && certbot --version && age --version > /var/log/visioncast/cloud-init-versions.log 2>&1 || true" ]

final_message: "visioncast-events cloud-init finished after $UPTIME s; next: upload release.tar and run deploy/production/bootstrap.sh"
