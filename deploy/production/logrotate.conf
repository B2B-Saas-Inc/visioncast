# Installed by deploy/production/bootstrap.sh as /etc/logrotate.d/visioncast.
# nginx's own logs (/var/log/nginx/*.log, including visioncast.access.log) are rotated
# by the nginx package's /etc/logrotate.d/nginx (daily, 14 days). Container logs are
# handled by the Docker json-file driver limits set in /etc/docker/daemon.json.
/var/log/visioncast/*.log {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root adm
}
