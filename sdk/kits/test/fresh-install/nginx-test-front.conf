# Test front for fresh-install.sh approach B (nginx in Docker): :80 -> Astro (host :4321),
# :81 -> Nuxt (host :3002), :82 -> static page from the nocode snippet. Each server includes
# sdk/kits/node/nginx-webinar-api.conf (with 127.0.0.1:8787 rewritten to host.docker.internal
# because the sidecar runs on the Docker host here).
server {
    listen 80;
    server_name localhost;
    include /etc/nginx/kit/nginx-webinar-api.conf;
    location / {
        proxy_pass http://host.docker.internal:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8081;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 81;
    server_name localhost;
    include /etc/nginx/kit/nginx-webinar-api.conf;
    location / {
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8082;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 82;
    server_name localhost;
    include /etc/nginx/kit/nginx-webinar-api.conf;
    root /site;
    index index.html;
}
