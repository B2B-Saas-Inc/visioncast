# Same-origin routing for /webinar-api/* to the stdlib proxy running as a sidecar:
#   PROXY_BACKEND_URL=https://webinars.example.com PROXY_API_KEY=... \
#   PROXY_ALLOWED_ORIGINS=https://www.example.com PROXY_TRUST_FORWARDED_FOR=1 \
#   HOST=127.0.0.1 PORT=8787 node sdk/proxy/server.js
# Include inside the server {} block for https://www.example.com. Use this for any
# framework or static host whose server you control: Astro, Nuxt, Gatsby, plain HTML.

# Exact routes only; everything else under /webinar-api/ is a 404 here and in the proxy.
location ~ ^/webinar-api/(profile|registrations|reset|my-registration|calendar\.ics)$ {
    proxy_pass http://127.0.0.1:8787;      # no URI part: the original path is forwarded verbatim
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the proxy trusts the first X-Forwarded-For entry
    # when PROXY_TRUST_FORWARDED_FOR=1, so a client-supplied value must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Origin, Sec-Fetch-Site, Cookie and X-Webinar-CSRF pass through by default; the proxy needs them.
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 64k;
}

location ^~ /webinar-api/ {
    return 404;
}
