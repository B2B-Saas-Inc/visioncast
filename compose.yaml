# Docker Compose deployment for a single host.
#
#   cp .env.example .env    # then fill in every secret (see comments in the file)
#   docker compose build
#   docker compose run --rm migrate
#   docker compose up -d
#
# All configuration comes from .env; no secrets are written in this file.
# The database is reachable only on the internal `backend` network and has no
# published port. The web port is bound to 127.0.0.1: put a TLS-terminating
# reverse proxy (with rate limiting) in front of it.

name: webinar-platform

x-app-hardening: &app-hardening
  image: webinar-platform:local
  pull_policy: never          # built locally by the `migrate` service; never pulled
  env_file: [.env]
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [backend, egress]

services:
  db:
    image: postgres:16-alpine   # pin by digest for production (postgres:16-alpine@sha256:...)
    restart: unless-stopped
    env_file: [.env]            # uses POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *app-hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    pull_policy: build
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-hardening
    command: ["web"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # HEALTHCHECK is defined in the Dockerfile (GET /healthz).

  worker:
    <<: *app-hardening
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/docker/worker_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Test runner (opt-in): docker compose --profile test run --rm test
  # tests/ and pyproject.toml are bind-mounted read-only; nothing is baked in.
  test:
    profiles: ["test"]
    image: webinar-platform:test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    env_file: [.env]
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    command: []
    working_dir: /app
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    internal: true     # no route to the internet; db lives only here
  egress: {}           # outbound HTTPS for webhook delivery (worker) and published port (web)

volumes:
  pgdata: {}
