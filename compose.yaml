# Docker Compose deployment for a single host.
#
#   cp .env.example .env    # then fill in every secret (see comments in the file)
#   deploy/build-image.sh   # or: docker compose build  (no version labels)
#   docker compose run --rm migrate
#   docker compose up -d
#
# All configuration comes from .env; no secrets are written in this file.
# The database is reachable only on the internal `backend` network and has no
# published port. The web port is bound to 127.0.0.1: put a TLS-terminating
# reverse proxy (with rate limiting) in front of it.
#
# Image selection (both variables may live in .env; Compose reads it for interpolation):
#   WEBINAR_IMAGE        image used by migrate/web/worker. Default webinar-platform:local,
#                        which `docker compose build` produces. deploy/build-image.sh tags
#                        webinar-platform:<version>; deploy with WEBINAR_IMAGE=webinar-platform:<version>.
#   WEBINAR_PULL_POLICY  for the `migrate` service only (the one with a `build:` section).
#                        Default "build" (build locally). Set "never" together with a pulled
#                        image (`docker pull ghcr.io/<owner>/<repo>:<version>` first) so
#                        nothing is built. No image has been published yet; see README.

name: webinar-platform

x-app-hardening: &app-hardening
  image: ${WEBINAR_IMAGE:-webinar-platform:local}
  pull_policy: never          # web/worker never pull: the image is built locally or pulled explicitly
  env_file: [.env]
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [backend, egress]

services:
  db:
    # postgres:16-alpine (PostgreSQL 16.15), index digest resolved 2026-10-27.
    # Refresh: docker buildx imagetools inspect postgres:16-alpine  (README "Supply chain notes")
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    env_file: [.env]            # uses POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *app-hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Optional label inputs; deploy/build-image.sh is the labelled, tagged build path.
        WEBINAR_VERSION: ${WEBINAR_VERSION:-}
        WEBINAR_REVISION: ${WEBINAR_REVISION:-}
        WEBINAR_CREATED: ${WEBINAR_CREATED:-}
    pull_policy: ${WEBINAR_PULL_POLICY:-build}
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-hardening
    command: ["web"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # HEALTHCHECK is defined in the Dockerfile (GET /healthz).

  worker:
    <<: *app-hardening
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/docker/worker_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Test runner (opt-in): docker compose --profile test run --rm test
  # tests/ and pyproject.toml are bind-mounted read-only; nothing is baked in.
  test:
    profiles: ["test"]
    image: webinar-platform:test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    env_file: [.env]
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    command: []
    working_dir: /app
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    internal: true     # no route to the internet; db lives only here
  egress: {}           # outbound HTTPS for webhook delivery (worker) and published port (web)

volumes:
  pgdata: {}
