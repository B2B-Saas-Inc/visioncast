[package]
name = "visioncast-captions"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Whisper, as a small HTTP service, for visioncast-live's captions"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
whisper-rs = "0.16"

[profile.release]
lto = "thin"
strip = true
